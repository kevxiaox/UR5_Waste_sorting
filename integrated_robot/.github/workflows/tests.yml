name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify the taught references
        run: python data/planning_inputs_four_objects_tcp_zero/verify_inputs.py
      - name: Unit tests (simulation only, no robot or camera)
        run: python -m unittest discover -s tests -v
